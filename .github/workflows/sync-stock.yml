name: Sync stock + deploy to Pages

on:
  schedule:
    - cron: "0 2 * * *"   # cada 24 horas, 02:00 UTC
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Última copia buena del stock (CSV). Sirve para dos cosas:
      #  · Los push de código (index.html, assets…) publican con esta copia
      #    y NO vuelven a descargar todo el inventario de Metasync.
      #  · Si la API devuelve vacío o una descarga parcial, el script
      #    conserva esta copia en vez de publicar un catálogo sin piezas.
      - name: Restore last good stock
        id: stock
        uses: actions/cache/restore@v4
        with:
          path: |
            data/stock.csv
            data/vehiculos.csv
          key: stock-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-

      # Se descarga de Metasync en el cron diario y en el lanzamiento manual.
      # En un push solo se descarga si todavía no hay copia guardada.
      - name: Download stock from Metasync API
        id: sync
        if: github.event_name != 'push' || steps.stock.outputs.cache-matched-key == ''
        env:
          METASYNC_APIKEY:    ${{ secrets.METASYNC_APIKEY }}
          METASYNC_IDEMPRESA: ${{ secrets.METASYNC_IDEMPRESA }}
        run: node scripts/sync-metasync.js

      - name: Save stock as last good copy
        if: steps.sync.outputs.fuente == 'api'
        uses: actions/cache/save@v4
        with:
          path: |
            data/stock.csv
            data/vehiculos.csv
          key: stock-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build index + family JSONs + vehiculos.json
        if: steps.sync.outputs.fuente != 'vacio'
        run: node scripts/build-index.js

      # Respaldo: Metasync no ha devuelto piezas y no hay copia anterior.
      # Se copian los datos ya publicados por ReciclaCAT (mismo inventario
      # y mismo formato) para no publicar la web vacía.
      - name: Fallback - copy published catalog from ReciclaCAT
        if: steps.sync.outputs.fuente == 'vacio'
        run: node scripts/mirror-reciclacat.js

      - name: Prepare site for Pages
        run: |
          rm -rf node_modules
          rm -f data/stock.csv
          rm -f data/vehiculos.csv
          sed -i "s#assets/app\\.js\"#assets/app.js?v=${GITHUB_SHA::7}\"#" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/sync-stock.yml/enable
