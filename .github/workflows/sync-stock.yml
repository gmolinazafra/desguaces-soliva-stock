name: Sync stock + deploy to Pages

on:
  schedule:
    - cron: "0 2 * * *"   # cada 24 horas, 02:00 UTC
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # necesario para el keepalive (reactivar el workflow por API)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # 20/10/2026: REDIA ha parado su sistema (CRVNET/FTP y Metasync).
      # El inventario salvado de Soliva se lee de Red Desguace, con las
      # fotos del R2 propio (fotos.reddesguaces.com).
      # Si la descarga falla o llega incompleta, el paso da error y NO se
      # despliega: la web sigue con la última versión publicada.
      - name: Download stock from Red Desguace (stock + vehiculos)
        run: node scripts/sync-reddesguace.js

      - name: Build index + family JSONs + vehiculos.json
        run: node scripts/build-index.js

      - name: Prepare site for Pages
        run: |
          # Cache-busting de assets/app.js: añadimos el SHA corto del commit como
          # query string en cada deploy, para que el navegador/CDN nunca sirvan
          # una copia vieja del script tras un cambio de código (el campo solo
          # cambia cuando cambia el commit desplegado, no en cada cron sin código nuevo).
          sed -i "s#assets/app\\.js\"#assets/app.js?v=${GITHUB_SHA::7}\"#" index.html
          # Seguridad (21/11/2026): se publica SOLO lo que la web necesita.
          # Antes se subía la carpeta entera, así que scripts/, README.md,
          # package.json y los CSV intermedios quedaban a la vista en
          # desguacessoliva.com/scripts/… con la configuración de la descarga.
          rm -rf _site && mkdir _site
          cp -r index.html favicon.ico CNAME assets _site/
          mkdir -p _site/data
          cp -r data/meta.json data/vehiculos.json data/index data/familias _site/data/
          # Nunca publicar los CSV de origen
          find _site -name '*.csv' -delete
          echo "Publicado:"; find _site -maxdepth 2 | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keepalive (evita desactivación por 60 días de inactividad)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/sync-stock.yml/enable
