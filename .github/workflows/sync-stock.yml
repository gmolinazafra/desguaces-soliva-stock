name: Sync stock + deploy to Pages

on:
  schedule:
    - cron: "0 2 * * *"   # cada 24 horas, 02:00 UTC
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Download stock from Metasync API
        env:
          METASYNC_APIKEY:    ${{ secrets.METASYNC_APIKEY }}
          METASYNC_IDEMPRESA: ${{ secrets.METASYNC_IDEMPRESA }}
        run: node scripts/sync-metasync.js

      - name: Build index + family JSONs + vehiculos.json
        run: node scripts/build-index.js

      - name: Prepare site for Pages
        run: |
          rm -rf node_modules
          rm -f data/stock.csv
          rm -f data/vehiculos.csv
          sed -i "s#assets/app\\.js\"#assets/app.js?v=${GITHUB_SHA::7}\"#" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/sync-stock.yml/enable
